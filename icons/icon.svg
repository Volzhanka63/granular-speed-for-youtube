<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#16181d"/>
  <!-- gauge track: 270deg sweep around (64,70), r=40 -->
  <path d="M35.72 98.28 A40 40 0 1 1 92.28 98.28" fill="none" stroke="#3a3f4b" stroke-width="11" stroke-linecap="round"/>
  <!-- filled part up to the needle (30deg) -->
  <path d="M35.72 98.28 A40 40 0 1 1 98.64 50" fill="none" stroke="#ffb020" stroke-width="11" stroke-linecap="round"/>
  <!-- needle -->
  <line x1="64" y1="70" x2="89.98" y2="55" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="64" cy="70" r="9" fill="#fff"/>
</svg>
